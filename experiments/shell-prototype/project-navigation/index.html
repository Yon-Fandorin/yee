      const layouts=[...root.querySelectorAll(&#x27;.mn-app&#x27;)].map(app=&gt;({app,orientation:app.dataset.layout,popup:null,expanded:{&#x27;reading-group&#x27;:true,&#x27;yee-project&#x27;:true},stripCollapsed:{&#x27;reading-group&#x27;:true,&#x27;yee-project&#x27;:false},design:{sidebarWidth:244,density:&#x27;compact&#x27;}}));

      function pageRow(page) {

      function outline(layout) {

      }
      function panel() {

        else body=`&lt;p&gt;프로젝트에 보관한 페이지입니다. 원할 때 브라우저 탭으로 다시 열 수 있어요.&lt;/p&gt;&lt;div class=&quot;mn-panel-note&quot;&gt;${pages[item.page].host}&lt;/div&gt;${command(&#x27;reopen-source&#x27;,&#x27;페이지 열기&#x27;,&#x27;mn-primary&#x27;,`data-source-page=&quot;${item.page}&quot;`)}`;

      function popover(layout) {

      function openPage(id) {

      function startProjectChat() {
        const id=&#x27;chat-&#x27;+(++shared.serial),message=shared.hubDraft.trim();
        items[id]={id,kind:&#x27;chat&#x27;,title:message?message.slice(0,32):&#x27;새 대화&#x27;,message:message||&#x27;이 프로젝트에서 새 대화를 시작합니다.&#x27;};
        containers[&#x27;yee-project&#x27;].items.push(id);activityOrder.unshift(id);shared.hubDraft=&#x27;&#x27;;shared.reply=&#x27;&#x27;;shared.answered=false;openItem(id);
      }
      function applyRememberedState(widgetState) {
        const saved=widgetState?.privateContent?.mixedNavigation;
        if(saved?.version!==3)return;

        pages[shared.activePage].open=true;
        layouts.forEach(layout=&gt;{const options=saved.layouts?.[layout.orientation];if(!options)return;[&#x27;reading-group&#x27;,&#x27;yee-project&#x27;].forEach(id=&gt;{if(typeof options.expanded?.[id]===&#x27;boolean&#x27;)layout.expanded[id]=options.expanded[id];});if(options.density===&#x27;compact&#x27;||options.density===&#x27;comfortable&#x27;)layout.design.density=options.density;if(Number.isFinite(options.sidebarWidth))layout.design.sidebarWidth=Math.max(220,Math.min(280,options.sidebarWidth));});
